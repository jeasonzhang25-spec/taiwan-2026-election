name: 監看選舉資料時效

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 讀取網站資料
        uses: actions/checkout@v4

      - name: 判斷民調、候選人與政見監測是否過期
        id: freshness
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path("src/lib/data/generated/public-polls.json").read_text(encoding="utf-8"))
          candidate_audit = json.loads(Path("src/lib/data/generated/candidate-registration-audit.json").read_text(encoding="utf-8"))
          policy_audit = json.loads(Path("src/lib/data/generated/candidate-policy-audit.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          checked_at = datetime.fromisoformat(f"{data['checkedAt']}T23:59:59+08:00")
          candidate_checked_at = datetime.fromisoformat(candidate_audit["generatedAt"])
          policy_checked_at = datetime.fromisoformat(policy_audit["generatedAt"])
          age_hours = (now - checked_at).total_seconds() / 3600
          candidate_age_hours = (now - candidate_checked_at).total_seconds() / 3600
          policy_age_hours = (now - policy_checked_at).total_seconds() / 3600
          print(f"checked_at={data['checkedAt']}")
          print(f"age_hours={age_hours:.1f}")
          print(f"candidate_age_hours={candidate_age_hours:.1f}")
          print(f"policy_age_hours={policy_age_hours:.1f}")
          print(f"stale={'true' if age_hours > 72 or candidate_age_hours > 30 or policy_age_hours > 30 else 'false'}")
          PY

      - name: 建立或更新過期提醒
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        env:
          CHECKED_AT: ${{ steps.freshness.outputs.checked_at }}
          AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
          CANDIDATE_AGE_HOURS: ${{ steps.freshness.outputs.candidate_age_hours }}
          POLICY_AGE_HOURS: ${{ steps.freshness.outputs.policy_age_hours }}
        with:
          script: |
            const title = "[自動提醒] 選舉資料超過時效未核驗";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const body = [
              `網站資料最後成功核驗日期：${process.env.CHECKED_AT}`,
              `民調距今約 ${process.env.AGE_HOURS} 小時；候選人台帳約 ${process.env.CANDIDATE_AGE_HOURS} 小時；政見監測約 ${process.env.POLICY_AGE_HOURS} 小時。`,
              "門檻：民調 72 小時，候選人與政見監測 30 小時。",
              "",
              `查看排程：https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/sync-polls.yml`,
            ].join("\n");
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: 資料恢復後關閉過期提醒
        if: steps.freshness.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[自動提醒] 選舉資料超過時效未核驗";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
