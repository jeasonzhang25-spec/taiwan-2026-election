name: 同步公開民調

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-polls
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取網站程式
        uses: actions/checkout@v4

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安裝同步工具
        run: pip install requests beautifulsoup4

      - name: 保留上一版作為異常縮水基準
        run: cp src/lib/data/generated/public-polls.json /tmp/public-polls.previous.json

      - name: 重新整理與驗證民調資料
        run: |
          npm run sync:polls
          npm run validate:polls -- --previous /tmp/public-polls.previous.json

      - name: 驗證網站
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: 保存有意義的資料變更
        run: |
          if git diff --quiet -- src/lib/data/generated/public-polls.json; then
            echo "資料內容沒有改變"
            exit 0
          fi
          git config user.name "island-election-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/generated/public-polls.json
          git commit -m "data: 同步公開民調"
          git push
